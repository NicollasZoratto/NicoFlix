<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NicoFlix - Autenticação</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #141414;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .auth-card {
      background-color: #1f1f1f;
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .btn-purple {
      background: linear-gradient(90deg, #8a2be2, #da70d6);
      border: none;
      color: white;
      font-weight: bold;
    }

    .btn-purple:hover {
      opacity: 0.9;
      color: white;
    }

    .link-muted {
      color: #c4b5fd;
      text-decoration: none;
      font-size: 0.85rem;
    }

    .link-muted:hover {
      text-decoration: underline;
      color: #da70d6;
    }
  </style>
</head>

<body>
  <div class="auth-card">
    <h2 class="text-center mb-3 text-danger fw-bold">NicoFlix</h2>
    <p class="text-center text-muted small">Acesse ou crie sua conta para continuar</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <ul class="nav nav-pills nav-justified mb-3" id="pills-tab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active text-white" id="tab-login" data-bs-toggle="pill" data-bs-target="#pills-login" type="button">Entrar</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link text-white" id="tab-cadastro" data-bs-toggle="pill" data-bs-target="#pills-cadastro" type="button">Cadastrar</button>
      </li>
    </ul>

    <div class="tab-content" id="pills-tabContent">
      <!-- ABA LOGIN -->
      <div class="tab-pane fade show active" id="pills-login" role="tabpanel">
        <form action="{{ url_for('login') }}" method="POST">
          <div class="mb-3">
            <label class="form-label">Usuário</label>
            <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
          </div>
          <button type="submit" class="btn btn-purple w-100 py-2">Entrar</button>
        </form>
        <div class="text-center mt-3">
          <a href="{{ url_for('esqueci_senha') }}" class="link-muted">Esqueci minha senha</a>
        </div>
      </div>

      <!-- ABA CADASTRO -->
      <div class="tab-pane fade" id="pills-cadastro" role="tabpanel">
        <form action="{{ url_for('cadastro') }}" method="POST">
          <div class="mb-3">
            <label class="form-label">Usuário</label>
            <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required>
          </div>
          <div class="mb-3">
            <label class="form-label">E-mail</label>
            <input type="email" name="email" class="form-control bg-dark text-white border-secondary" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Senha</label>
            <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
          </div>
          <button type="submit" class="btn btn-purple w-100 py-2">Criar Conta</button>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
