<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NicoFlix — Autenticação</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <div class="auth-container">
    <h2>NicoFlix</h2>
    <p class="auth-subtitle">Acesse ou crie sua conta para continuar</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category if category != 'error' else 'danger' }}">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <div class="tabs">
      <button type="button" class="tab-btn active" data-tab="login" onclick="mostrarAba('login')">Entrar</button>
      <button type="button" class="tab-btn" data-tab="cadastro" onclick="mostrarAba('cadastro')">Cadastrar</button>
    </div>

    <div class="tab-panel active" id="tab-login">
      <form action="{{ url_for('login') }}" method="POST">
        <div class="form-group">
          <label>Usuário</label>
          <input type="text" name="username" required>
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" name="password" required>
        </div>
        <button type="submit">Entrar</button>
      </form>
      <div class="text-center mt-3">
        <a href="{{ url_for('esqueci_senha') }}" class="link-muted">Esqueci minha senha</a>
      </div>
    </div>

    <div class="tab-panel" id="tab-cadastro">
      <form action="{{ url_for('cadastro') }}" method="POST">
        <div class="form-group">
          <label>Usuário</label>
          <input type="text" name="username" required>
        </div>
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" name="email" required>
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" name="password" required>
        </div>
        <button type="submit">Criar Conta</button>
      </form>
    </div>
  </div>

  <script>
    function mostrarAba(nome) {
      document.querySelectorAll('.tab-btn').forEach(function (btn) {
        btn.classList.toggle('active', btn.dataset.tab === nome);
      });
      document.querySelectorAll('.tab-panel').forEach(function (panel) {
        panel.classList.toggle('active', panel.id === 'tab-' + nome);
      });
    }
  </script>
</body>

</html>
