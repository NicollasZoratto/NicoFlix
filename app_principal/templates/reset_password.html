<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NicoFlix — Redefinir senha</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
  <div class="auth-container">
    <h2>NicoFlix</h2>
    <p class="auth-subtitle">Crie sua nova senha</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category if category != 'error' else 'danger' }}">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form action="{{ url_for('reset_senha', token=token) }}" method="POST">
      <div class="form-group">
        <label>Nova senha</label>
        <input type="password" name="password" required autofocus>
      </div>
      <div class="form-group">
        <label>Confirmar nova senha</label>
        <input type="password" name="confirm_password" required>
      </div>
      <button type="submit">Redefinir senha</button>
    </form>
  </div>
</body>

</html>
