<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NicoFlix - Verificação em 2 Etapas</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #141414;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .auth-card {
      background-color: #1f1f1f;
      border-radius: 12px;
      padding: 30px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .btn-purple {
      background: linear-gradient(90deg, #8a2be2, #da70d6);
      border: none;
      color: white;
      font-weight: bold;
    }

    .btn-purple:hover {
      opacity: 0.9;
      color: white;
    }

    input[name="code"] {
      letter-spacing: 0.5rem;
      text-align: center;
      font-size: 1.4rem;
    }
  </style>
</head>

<body>
  <div class="auth-card">
    <h2 class="text-center mb-2 text-danger fw-bold">NicoFlix</h2>
    <p class="text-center text-muted small">
      Digite o código de verificação enviado para <strong>{{ username }}</strong>
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category if category != 'error' else 'danger' }} alert-dismissible fade show" role="alert">
      {{ message }}
      <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form action="{{ url_for('verify_2fa_page') }}" method="POST">
      <div class="mb-3">
        <label class="form-label">Código de 6 dígitos</label>
        <input type="text" name="code" maxlength="6" pattern="[0-9]{6}"
               class="form-control bg-dark text-white border-secondary" required autofocus>
      </div>
      <button type="submit" class="btn btn-purple w-100 py-2">Verificar</button>
    </form>

    <div class="text-center mt-3">
      <a href="{{ url_for('login') }}" class="text-muted small">Voltar para o login</a>
    </div>
  </div>
</body>

</html>
