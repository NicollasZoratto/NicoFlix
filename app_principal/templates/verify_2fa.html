<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NicoFlix — Verificação em 2 Etapas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    input[name="code"] {
      letter-spacing: 0.6rem;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
    }
  </style>
</head>

<body>
  <div class="auth-container">
    <h2>NicoFlix</h2>
    <p class="auth-subtitle">
      Digite o código de verificação enviado para <strong>{{ username }}</strong>
    </p>

    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-{{ category if category != 'error' else 'danger' }}">{{ message }}</div>
    {% endfor %}
    {% endif %}
    {% endwith %}

    <form action="{{ url_for('verify_2fa_page') }}" method="POST">
      <div class="form-group">
        <label>Código de 6 dígitos</label>
        <input type="text" name="code" maxlength="6" pattern="[0-9]{6}" required autofocus>
      </div>
      <button type="submit">Verificar</button>
    </form>

    <div class="text-center mt-3">
      <a href="{{ url_for('login') }}" class="link-muted small">Voltar para o login</a>
    </div>
  </div>
</body>

</html>
