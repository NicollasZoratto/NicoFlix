version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: nicoflix_redis
    # sem "ports": só acessível dentro da rede interna do Docker
    networks:
      - nicoflix-net

  log_service:
    build:
      context: ./log_service
      dockerfile: Dockerfile
    container_name: nicoflix_logs
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - nicoflix-net

  # MinIO (Atividade 6): bucket dedicado pras fotos de perfil.
  # A porta 9000 (API S3) PRECISA ficar publicada: diferente do auth_service/
  # log_service/redis, é o NAVEGADOR do usuário que busca a imagem direto do
  # MinIO via URL pré-assinada — não dá pra deixar só na rede interna.
  #
  # Imagem: a MinIO removeu minio/minio e minio/mc do Docker Hub em
  # 11/09/2026 (projeto community arquivado em abril/2026), e o
  # quay.io/minio/minio fechou pull anônimo em 24/09/2026. Por isso usamos
  # bitnamilegacy/minio, que republica o mesmo binário e continua público.
  # Diferenças: não precisa de "command" (a imagem já sobe o servidor
  # sozinha) e os dados ficam em /bitnami/minio/data, não em /data.
  minio:
    image: bitnamilegacy/minio:latest
    container_name: nicoflix_minio
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-nicoflix_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-nicoflix_minio_secret}
    ports:
      # Servidor compartilhado: 9000/9001 já estão ocupadas por outros alunos.
      # Por isso a porta publicada é alta e incomum. Se ainda houver conflito,
      # defina MINIO_API_HOST_PORT com outra porta livre nas variáveis da stack.
      # O console web (9001) não é publicado.
      - "${MINIO_API_HOST_PORT:-29517}:9000"
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - nicoflix-net

  auth_service:
    build:
      context: ./auth_service
      dockerfile: Dockerfile
    container_name: nicoflix_auth
    environment:
      - DB_HOST=${DB_HOST:-35.226.64.52}
      - DB_USER=${DB_USER:-IAC_2026_02_nicollas_carvalho}
      - DB_PASSWORD=${DB_PASSWORD:-nico11as}
      - DB_NAME=${DB_NAME:-IAC_2026_02_nicollas_carvalho}
      - JWT_SECRET=${JWT_SECRET:-chave_secreta_jwt_super_segura}
      - PUBLIC_APP_URL=${PUBLIC_APP_URL:-http://localhost:8223}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-2525}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - SMTP_FROM=${SMTP_FROM:-no-reply@nicoflix.local}
      - LOG_SERVICE_URL=http://log_service:5002
    depends_on:
      - log_service
    networks:
      - nicoflix-net

  web:
    build:
      context: ./app_principal
      dockerfile: Dockerfile
    container_name: nicoflix_web
    ports:
      - "8223:80"
    environment:
      - AUTH_SERVICE_URL=http://auth_service:5001
      - LOG_SERVICE_URL=http://log_service:5002
      - TMDB_API_KEY=${TMDB_API_KEY:-6566259ba55415e75fcdaaec316a8be7}
      - DB_HOST=${DB_HOST:-35.226.64.52}
      - DB_USER=${DB_USER:-IAC_2026_02_nicollas_carvalho}
      - DB_PASSWORD=${DB_PASSWORD:-nico11as}
      - DB_NAME=${DB_NAME:-IAC_2026_02_nicollas_carvalho}
      - SECRET_KEY=${SECRET_KEY:-chave_secreta_padrao_desenv}
      # MinIO: endpoint interno (upload real, via rede Docker) e endpoint
      # público (só pra assinar a URL que o navegador vai usar)
      - MINIO_INTERNAL_ENDPOINT=minio:9000
      # Vazio = o app usa o mesmo host que o usuário abriu no navegador
      - MINIO_PUBLIC_ENDPOINT=${PUBLIC_MINIO_ENDPOINT:-}
      - MINIO_PUBLIC_PORT=${MINIO_API_HOST_PORT:-29517}
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-nicoflix_admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-nicoflix_minio_secret}
      - MINIO_BUCKET=${MINIO_BUCKET:-nicoflix-perfis}
      - MINIO_SECURE=${MINIO_SECURE:-false}
      - PRESIGNED_URL_EXPIRY_SECONDS=${PRESIGNED_URL_EXPIRY_SECONDS:-3600}
    depends_on:
      - auth_service
      - log_service
      - minio
    networks:
      - nicoflix-net

networks:
  nicoflix-net:
    driver: bridge

volumes:
  minio_data:
